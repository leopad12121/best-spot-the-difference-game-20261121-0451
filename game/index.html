<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row — Spot the Difference</title>
<style>
  :root {
    --ink: #f6e3c5;
    --ink-dim: #c9a86a;
    --gold: #f2b544;
    --gold-soft: #ffd97a;
    --red: #d94f3d;
    --panel-bg: #1c2340;
    --page-bg: #141829;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--page-bg); }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  #app { width: 1280px; max-width: 100vw; padding: 10px 14px 14px; }
  header#hud {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 6px 4px 10px;
  }
  #hud .brand { font-size: 26px; letter-spacing: 2px; color: var(--gold); font-weight: bold; }
  #hud .level-name { font-size: 15px; color: var(--ink-dim); font-style: italic; }
  .hud-group { display: flex; align-items: center; gap: 18px; }
  .hud-item { font-size: 18px; white-space: nowrap; }
  .hud-item b { color: var(--gold-soft); }
  #timer.low { color: #ff7a6b; font-weight: bold; }
  #hint-btn {
    font-family: inherit; font-size: 16px; cursor: pointer;
    background: #2a3358; color: var(--gold-soft);
    border: 1px solid var(--gold); border-radius: 8px; padding: 6px 14px;
  }
  #hint-btn:disabled { opacity: 0.4; cursor: default; }
  #hint-btn.cooling { opacity: 0.55; }
  main#panels { display: flex; gap: 14px; position: relative; }
  .panel { flex: 1 1 0; background: var(--panel-bg); border: 2px solid #3a4470; border-radius: 10px; overflow: hidden; }
  .panel .panel-label {
    padding: 5px 10px; font-size: 13px; letter-spacing: 3px;
    color: var(--ink-dim); background: #232a4a; text-transform: uppercase;
  }
  .panel svg { display: block; width: 100%; height: auto; cursor: crosshair; }
  footer#keys { padding: 8px 4px 0; font-size: 13px; color: var(--ink-dim); text-align: center; }
  footer#keys kbd {
    background: #2a3358; border: 1px solid #4a5578; border-radius: 4px;
    padding: 1px 6px; font-family: inherit; color: var(--ink);
  }
  /* Markers drawn inside the SVG panels. */
  .ring {
    fill: none; stroke: var(--gold); stroke-width: 5;
    transform-box: fill-box; transform-origin: center;
    animation: ring-pop 0.55s ease-out;
  }
  @keyframes ring-pop {
    0% { transform: scale(0.2); opacity: 0; }
    55% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .wrong-x line { stroke: #9aa3b8; stroke-width: 5; stroke-linecap: round; }
  .wrong-x { animation: x-fade 0.9s ease-out forwards; }
  @keyframes x-fade { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  .hint-pulse {
    fill: none; stroke: var(--gold-soft); stroke-width: 4;
    transform-box: fill-box; transform-origin: center;
    animation: hint-pulse 1.5s ease-in-out;
  }
  @keyframes hint-pulse {
    0%, 100% { transform: scale(0.7); opacity: 0.15; }
    50% { transform: scale(1.25); opacity: 1; }
  }
  /* Full-screen overlay cards (title / level complete / game complete). */
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(10, 12, 26, 0.72); z-index: 10;
  }
  #overlay.open { display: flex; }
  .card {
    background: #1e2547; border: 2px solid var(--gold); border-radius: 14px;
    padding: 28px 36px; max-width: 560px; text-align: center;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
  }
  .card h1 { margin: 0 0 6px; color: var(--gold); font-size: 40px; letter-spacing: 3px; }
  .card h2 { margin: 0 0 10px; color: var(--gold); font-size: 30px; }
  .card p { margin: 8px 0; font-size: 16px; line-height: 1.5; }
  .card .big { font-size: 20px; }
  .card .sub { color: var(--ink-dim); font-size: 14px; }
  .card button {
    font-family: inherit; font-size: 19px; cursor: pointer; margin-top: 16px;
    background: var(--gold); color: #241a05; border: none; border-radius: 10px;
    padding: 12px 30px; font-weight: bold;
  }
  .card button:hover { background: var(--gold-soft); }
  .card .row { display: flex; gap: 26px; justify-content: center; margin-top: 10px; }
  .card .row div b { display: block; font-size: 26px; color: var(--gold-soft); }
  .card .changes { text-align: left; display: inline-block; margin: 10px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-dim); }
  .card .changes li { margin: 2px 0; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div>
      <div class="brand">🏮 Lantern Row</div>
      <div class="level-name" id="level-name">Spot the Difference</div>
    </div>
    <div class="hud-group">
      <span class="hud-item" id="found-counter">Found <b>0 / 7</b></span>
      <span class="hud-item" id="timer">⏱ 3:00</span>
      <span class="hud-item" id="score">Score <b>0</b></span>
      <button id="hint-btn" type="button" title="Hint (H)">💡 Hint ×3</button>
    </div>
  </header>
  <main id="panels">
    <section class="panel" id="panel-left">
      <div class="panel-label">Left · Original</div>
      <div id="holder-left"></div>
    </section>
    <section class="panel" id="panel-right">
      <div class="panel-label">Right · Find the changes</div>
      <div id="holder-right"></div>
    </section>
  </main>
  <footer id="keys">
    Click a difference on either picture · <kbd>H</kbd> hint · <kbd>R</kbd> restart level · <kbd>Esc</kbd> back to title
  </footer>
</div>
<div id="overlay"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
